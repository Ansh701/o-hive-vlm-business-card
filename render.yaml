services:
  - type: web
    name: o-hive-vlm-business-card
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: ALLOWED_HOSTS
        value: '["o-hive-vlm-business-card.onrender.com"]'
      - key: CORS_ORIGINS
        value: '[]'
      - key: AWS_INFERENCE_ENDPOINT
        sync: false
      - key: AWS_INFERENCE_SHARED_SECRET
        sync: false
      - key: MAX_DAILY_CARDS
        value: "100"
      - key: INFERENCE_CONCURRENCY
        value: "2"
      - key: INFERENCE_TIMEOUT_SECONDS
        value: "75"
      - key: MAX_CARDS_PER_BATCH
        value: "20"
      - key: MAX_FILE_BYTES
        value: "4194304"
