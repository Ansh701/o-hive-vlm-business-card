name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: o_hive_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d o_hive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]' pip-audit
      - run: pip-audit . --progress-spinner off
      - run: pip-audit -r inference/requirements.txt --progress-spinner off
      - run: ruff check backend scripts inference
      - run: mypy backend/app scripts inference
      - run: pytest -q
      - name: Clean PostgreSQL migration
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/o_hive_test
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: o-hive-card-leads:ci

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint infra/aws/*.yaml
      - name: Install CloudFormation Guard
        env:
          GUARD_VERSION: 3.2.1
          GUARD_SHA256: 09c2b8cfd81d513374a8da89d4805dc55006a3da52bbf598e272022d4d198e94
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/cfn-guard.tar.gz \
            "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/${GUARD_VERSION}/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz"
          echo "${GUARD_SHA256}  /tmp/cfn-guard.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/cfn-guard.tar.gz --directory /tmp
          sudo install --mode 0755 /tmp/cfn-guard-v3-ubuntu-latest/cfn-guard /usr/local/bin/cfn-guard
      - run: cfn-guard validate --rules infra/aws/guard.rules --data infra/aws/inference-ec2.yaml infra/aws/budget.yaml
