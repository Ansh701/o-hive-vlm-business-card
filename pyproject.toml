[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "o-hive-card-leads"
version = "0.1.0"
description = "Secure bulk business-card lead extraction with AWS-hosted Qwen VLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<1",
  "email-validator>=2.3,<3",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1.5,<4",
  "phonenumbers>=9.0,<10",
  "pillow>=12.1,<13",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy[asyncio]>=2.0.46,<3",
  "structlog>=25.5,<27",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22,<1",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "pyyaml>=6.0,<7",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["backend/alembic/versions"]

[[tool.mypy.overrides]]
module = ["phonenumbers.*", "openpyxl.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
